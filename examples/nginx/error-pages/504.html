<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Timeout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #fa709a;
            margin-top: 0;
            font-size: 2.5em;
        }
        p {
            color: #666;
            line-height: 1.6;
            font-size: 1.1em;
        }
        .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .status-code {
            color: #999;
            font-size: 0.9em;
            margin-top: 30px;
        }
        .action {
            margin-top: 20px;
        }
        button {
            background: #fa709a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #e8608a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⏱️</div>
        <h1>Gateway Timeout</h1>
        <p>The request took too long to process.</p>
        <p>Our servers might be experiencing high load. Please try again in a moment.</p>
        <div class="action">
            <button onclick="window.location.reload()">Try Again</button>
        </div>
        <div class="status-code">HTTP 504 - Gateway Timeout</div>
    </div>
</body>
</html>
